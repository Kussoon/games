<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf7ff">
<title>都道府県名記憶ゲーム Ver.4.7.14</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
body{background:linear-gradient(180deg,#eaf7ff,#fff);color:#17324a}
main{max-width:760px;margin:auto;padding:14px 12px 26px}
header{text-align:center;margin-bottom:12px}
h1{margin:4px 0 3px;font-size:clamp(28px,7vw,42px);color:#17538e}
.sub{font-weight:800;color:#557286}
.card{background:#fff;border:1px solid #bfdeec;border-radius:18px;padding:14px;box-shadow:0 5px 16px #1f55731a;margin-bottom:12px}
.teacher{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center}
.teacher img{width:92px;height:110px;object-fit:contain}
.bubble{background:#fff7d7;border:2px solid #efc84c;border-radius:16px;padding:11px 13px;font-weight:800;line-height:1.55}
h2{margin:4px 0 10px;font-size:20px;color:#244e67}
.region-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.range-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:9px}
button{font:inherit;border:0;border-radius:14px;padding:12px 7px;font-weight:900;cursor:pointer}
.region{background:#dff4fc;border:2px solid #8bd1ed;color:#176083}
.range{background:#efe4ff;border:2px solid #bea0e4;color:#603d89}
.region.active{background:#3eb1df;color:#fff}
.range.active{background:#8e66c2;color:#fff}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{min-height:92px;text-align:left;padding:14px 15px;color:#273941;box-shadow:0 2px 8px #0001}
.mode strong{display:block;font-size:18px;margin-bottom:4px}
.mode small{display:block;font-size:12px;line-height:1.45;font-weight:700}
.study{background:#e8f8e7;border:2px solid #8dcc8a}
.q1{background:#e7f5ff;border:2px solid #7bc2e9}
.q2{background:#fff4cf;border:2px solid #e6c45c}
.write{background:#f3eafe;border:2px solid #b99adf}
.selected{margin-top:11px;padding:9px 10px;background:#f5fafc;border-radius:10px;text-align:center;font-size:13px;font-weight:800;color:#607681}
#notice{display:none;margin-top:10px;padding:10px;border-radius:12px;background:#fff8d8;border:1px solid #e7cb61;text-align:center;font-weight:800;line-height:1.5}
.credit{font-size:11px;color:#71838c;line-height:1.6;text-align:center;margin-top:18px;padding:12px 8px;border-top:1px solid #d9e7ec}
.credit a{color:#55798a}
@media(max-width:520px){
 main{padding:10px}
 .teacher{grid-template-columns:74px 1fr}
 .teacher img{width:74px;height:92px}
 .range-grid{grid-template-columns:repeat(2,1fr)}
 .modes{grid-template-columns:1fr}
}

#studyPage{display:none}.study-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.back,.zoomBtn{background:#e7eef1;color:#41545d}.studyTitle{text-align:center;font-size:clamp(24px,6vw,34px);font-weight:1000;color:#164f69;margin:8px 0}.studyHelp{text-align:center;color:#637984;font-weight:800;font-size:13px;margin-bottom:8px}.studyViewport{height:min(69vh,680px);overflow:hidden;background:#b8e1ef;border:3px solid #9bcfe2;border-radius:15px;touch-action:none;position:relative}.studyViewport svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}.studyViewport .prefecture{fill:#efb34d;stroke:#fff;stroke-width:1.4;vector-effect:non-scaling-stroke}.studyViewport .hidden-pref{display:none}.pref-name{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-weight:1000;fill:#16252d;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}.zoomRow{display:flex;gap:8px;justify-content:center;margin-top:9px;flex-wrap:wrap}.zoomRow button{padding:9px 15px}

#quiz1Page{display:none}
.quizHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.quizTitle{font-size:clamp(24px,6vw,42px);font-weight:900;text-align:center;margin:10px 0}
.quizProgress{text-align:center;font-weight:800;opacity:.8;margin-bottom:8px}
.quizViewport{height:min(68vh,760px);min-height:430px;border:4px solid #69c7ef;border-radius:24px;overflow:hidden;background:#b8e4f3;touch-action:none}
#quizSvg{width:100%;height:100%;display:block}
#quizSvg .prefecture{fill:#efb64d;stroke:#fff;stroke-width:3;cursor:pointer}
#quizSvg .prefecture.q-hidden{display:none}
#quizSvg .prefecture.q-correct{fill:#70c86b}
#quizSvg .prefecture.q-wrong{fill:#ef7777}
.quizMessage{min-height:46px;margin:12px auto 4px;text-align:center;font-size:22px;font-weight:900}
.mapFeedback{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  display:none;
  min-width:150px;
  padding:12px 20px;
  border-radius:18px;
  background:rgba(255,255,255,.94);
  border:3px solid #6c8794;
  text-align:center;
  font-size:clamp(26px,7vw,42px);
  font-weight:1000;
  line-height:1.15;
  box-shadow:0 4px 14px #0003;
  pointer-events:none;
}
.mapFeedback.correct{display:block;color:#1f7b32;border-color:#65b86d}
.mapFeedback.wrong{display:block;color:#c92f2f;border-color:#e27777}

.quizControls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0}
.quizControls button,.retryBtn{border:0;border-radius:16px;padding:13px 18px;font-size:17px;font-weight:900}
.nextBtn{background:#f4c542;color:#493600}
.retryBtn{background:#ffdf72;color:#4d3900;display:none}
.zoomQ{background:#e7f4f7;color:#24434b}
.resultBox{display:none;text-align:center;padding:18px;border-radius:20px;background:rgba(255,255,255,.82);margin:14px 0}.resultActions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.againBtn{background:#bfe8ff;color:#174c67}.missBtn{background:#ffe181;color:#5a4300}.topBtn{background:#e7edf1;color:#40515a}
.resultBox strong{font-size:28px}


#quiz2Page{display:none}
.quiz2Title{font-size:clamp(24px,6vw,40px);font-weight:900;text-align:center;margin:10px 0}
.quiz2Progress{text-align:center;font-weight:800;opacity:.8;margin-bottom:8px}
.quiz2Viewport{height:min(68vh,760px);min-height:430px;border:4px solid #69c7ef;border-radius:24px;overflow:hidden;background:#b8e4f3;touch-action:none}
#quiz2Svg{width:100%;height:100%;display:block}
#quiz2Svg .prefecture{fill:#efb64d;stroke:#fff;stroke-width:3}
#quiz2Svg .prefecture.q2-hidden{display:none}
#quiz2Svg .prefecture.q2-highlight{
  animation:q2Blink 1s steps(1,end) infinite;
  stroke-width:5;
}
@keyframes q2Blink{
  0%,49.999%{fill:#fff06a;stroke:#d89b00}
  50%,100%{fill:#efb64d;stroke:#fff}
}
.choiceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.choiceBtn{border:0;border-radius:16px;padding:14px 10px;font-size:18px;font-weight:900;background:#fff7cf;color:#4c3a00;border:2px solid #e8c64a}
.choiceBtn.correct{background:#c9f0c7;border-color:#67b762;color:#245b22}
.choiceBtn.wrong{background:#ffd0d0;border-color:#df7777;color:#7a2424}
.q2Message{min-height:42px;text-align:center;font-size:20px;font-weight:900}


#writePage{display:none}
.writeHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.writeTitle{text-align:center;font-size:clamp(24px,6vw,38px);font-weight:900;margin:8px 0}
.writeKana{text-align:center;font-size:clamp(30px,8vw,52px);font-weight:1000;color:#155574;margin:12px 0}
.writeProgress{text-align:center;font-weight:800;opacity:.8}
.canvasWrap{background:#fff;color-scheme:light;border:4px solid #86c9e6;border-radius:22px;overflow:hidden;margin:12px 0}
#writeCanvas{display:block;width:100%;height:360px;background:#fff;touch-action:none}
.writeControls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.writeControls button{border:0;border-radius:14px;padding:12px 16px;font-size:17px;font-weight:900}
.clearBtn{background:#edf2f4;color:#40515a}
.answerBtn{background:#ffe181;color:#5b4300}
.writeAnswer{display:none;text-align:center;background:#f3fff2;border:2px solid #9ed29a;border-radius:18px;padding:12px;margin-top:12px}
.writeAnswer .kanji{font-size:clamp(72px,18vw,128px);line-height:1.2;font-weight:800;color:#1c5b2d;letter-spacing:.04em;padding:8px 4px;font-family:"Yu Kyokasho Yoko","Yu Kyokasho","HGP教科書体","DFKai-SB","Hiragino Mincho ProN","Yu Mincho",serif}
.selfRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.goodBtn{background:#c9f0c7;color:#245b22}
.againWriteBtn{background:#ffd8aa;color:#764800}
.writeRetry{display:none;width:100%;margin-top:10px;background:#ffe181;color:#5b4300}
.writeResult{display:none;text-align:center;padding:18px;border-radius:20px;background:rgba(255,255,255,.84);margin:14px 0}


.mascot-corner{position:absolute;right:8px;bottom:8px;width:76px;max-height:110px;object-fit:contain;pointer-events:none;opacity:.96;z-index:3}
.card{position:relative}
@media(max-width:520px){.mascot-corner{width:62px;max-height:90px}}


/* Ver.3.4 home */
.home-hero{position:relative;min-height:125px;padding:18px 130px 8px 8px;text-align:left;margin-bottom:6px}
.home-hero h1{font-size:clamp(30px,7.2vw,44px);line-height:1.15;margin:0 0 12px;color:#174f9a}
.home-hero .sub{font-weight:900;color:#304858;font-size:15px}
.home-mascot{position:absolute;right:5px;bottom:0;width:118px;max-height:145px;object-fit:contain}
.home-card{padding:12px}
.home-modes{display:grid;grid-template-columns:1fr;gap:10px}
.home-modes .mode{display:grid;grid-template-columns:58px 1fr 24px;align-items:center;min-height:105px;padding:12px 14px;text-align:left}
.mode-icon{display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:12px;background:rgba(255,255,255,.66);font-size:28px}
.mode-copy strong{font-size:19px;margin-bottom:5px}
.mode-copy small{font-size:13px}
.chev{font-size:34px;line-height:1;color:#183a5a;text-align:right}
.home-region-box{margin-top:14px;padding:12px;border:1px solid #cfe0eb;border-radius:14px;background:#fbfdff}
.home-region-box h2{font-size:15px;color:#24548b;margin:0 0 10px}
.home-region-box .selected{margin-top:9px}

/* Character placement in game screens */
.studyViewport,.quizViewport,.quiz2Viewport,.canvasWrap{position:relative}
.screen-mascot{position:absolute;right:4px;bottom:2px;width:118px;max-height:155px;object-fit:contain;z-index:6;pointer-events:none}
#writePage .screen-mascot{width:105px;max-height:140px}
.mascot-corner{display:none!important}

@media(max-width:520px){
  .home-hero{min-height:112px;padding:14px 100px 4px 2px}
  .home-mascot{width:92px;max-height:120px}
  .home-hero h1{font-size:31px}
  .home-modes .mode{grid-template-columns:52px 1fr 20px;min-height:96px;padding:10px}
  .mode-icon{width:44px;height:44px;font-size:24px}
  .mode-copy strong{font-size:17px}
  .mode-copy small{font-size:12px}
  .screen-mascot{width:98px;max-height:132px}
  #writePage .screen-mascot{width:88px}
}

.mapZoomControls{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:10}
.mapZoomControls button{width:42px;height:42px;padding:0;border-radius:11px;background:rgba(255,255,255,.94);color:#24434b;border:1px solid #a9cbd8;box-shadow:0 2px 7px #0002;font-size:20px;font-weight:900}
.mapZoomControls .resetMapBtn{width:auto;min-width:76px;padding:0 10px;font-size:13px}
@media(max-width:520px){.mapZoomControls{top:7px;right:7px;gap:5px}.mapZoomControls button{width:38px;height:38px}.mapZoomControls .resetMapBtn{min-width:68px;padding:0 8px;font-size:12px}}

</style>
</head>

canvas.addEventListener("pointerup",()=>drawing=false);canvas.addEventListener("pointercancel",()=>drawing=false);

function writeQuestion(){
  if(writeIndex>=writeOrder.length){finishWrite();return}
  writeCurrent=writeOrder[writeIndex];
  writeProgress.textContent=`${writeIndex+1} / ${writeOrder.length}`;
  writeKana.textContent=HIRA[writeCurrent-1];
  writeKanji.textContent=PREF_NAMES[writeCurrent-1];
  writeAnswer.style.display="none";writeResult.style.display="none";clearCanvas();
  writeRetry.style.display=(writeMissed.size&&writeIndex>0)?"block":"none";
}
function openWrite(){
  document.querySelectorAll("main>.card").forEach(x=>x.style.display="none");
  writePage.style.display="block";
  requestAnimationFrame(()=>{resizeCanvas();startWrite(STUDY_SETS[selected],false)});
  window.scrollTo({top:0,behavior:"smooth"});
}
function startWrite(codes,isRetry=false){
  writeOrder=shuffle([...(isRetry?writeMissed:codes)]);
  if(!isRetry)writeMissed.clear(); else writeMissed.clear();
  writeIndex=0;writeResult.style.display="none";writeQuestion();
}
document.getElementById("writeClear").onclick=()=>{clearCanvas();writeAnswer.style.display="none"};
document.getElementById("showAnswer").onclick=()=>writeAnswer.style.display="block";
document.getElementById("selfGood").onclick=()=>{writeIndex++;writeQuestion()};
document.getElementById("selfAgain").onclick=()=>{writeMissed.add(writeCurrent);clearCanvas();writeAnswer.style.display="none";writeRetry.style.display="block"};
writeRetry.onclick=()=>{
  if(!writeMissed.size)return;
  const arr=[...writeMissed];writeMissed.clear();writeOrder=shuffle(arr);writeIndex=0;writeResult.style.display="none";writeQuestion();
};
function finishWrite(){
  writeKana.textContent="";writeProgress.textContent="";writeAnswer.style.display="none";writeRetry.style.display="none";
  const total=writeOrder.length,miss=writeMissed.size,ok=total-miss;
  writeResult.style.display="block";
  writeResult.innerHTML=`<strong>${ok} / ${total} 書けました</strong>${miss?`<br>できなかった問題：${[...writeMissed].map(c=>PREF_NAMES[c-1]).join("、")}`:"<br>🎉 全問クリア！"}
  <div class="resultActions">
    <button id="wAgain" class="againBtn">もう一回</button>
    <button id="wMissed" class="missBtn" ${miss?"":"disabled"}>間違えた問題だけ</button>
    <button id="wTop" class="topBtn">トップに戻る</button>
  </div>`;
  document.getElementById("wAgain").onclick=()=>startWrite(STUDY_SETS[selected],false);
  document.getElementById("wMissed").onclick=()=>{
    if(!writeMissed.size)return;
    const arr=[...writeMissed];writeMissed.clear();writeOrder=shuffle(arr);writeIndex=0;writeResult.style.display="none";writeQuestion();
  };
  document.getElementById("wTop").onclick=()=>document.getElementById("writeBack").click();
}
document.getElementById("writeBack").onclick=()=>{
  writePage.style.display="none";
  document.querySelectorAll("main>.card").forEach(x=>{if(!["studyPage","quiz1Page","quiz2Page","writePage"].includes(x.id))x.style.display=""});
  window.scrollTo({top:0,behavior:"smooth"});
};
window.addEventListener("resize",()=>{if(writePage.style.display!=="none")resizeCanvas()});

</script>
</body>
</html>

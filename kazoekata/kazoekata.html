:[],"source_check_flag":"explicit_use_verified","source_checked":true,"evidence":[{"source_id":"daijirin","scope":"題材または用例を直接確認","locator":"神輿"}],"unique_answer_review":{"status":"reviewed","basis":"問題文の対象・状態を限定し、併用可能な助数詞を選択肢から除外。4択内の唯一解として確認。日本語全体で他の言い方がないという意味ではない。"},"difficulty_review":"題材の身近さと数え方の専門性でコースを選定","editor_note":"","explanation_ruby":[]},{"id":"mania-050","course_id":"mania","course":"マニアックコース","subject":"太鼓","subject_reading":"たいこ","topic_key":"太鼓","question":"皮を張った太鼓の、昔からの数え方の一つは、どれ？","choices":[{"id":"A","counter_id":"梱","kanji":"梱","reading":"こり","one_reading":"ひとこり","label_kana":"こり"},{"id":"B","counter_id":"領","kanji":"領","reading":"りょう","one_reading":"いちりょう","label_kana":"りょう"},{"id":"C","counter_id":"張","kanji":"張","reading":"はり","one_reading":"ひとはり","label_kana":"はり"},{"id":"D","counter_id":"幅","kanji":"幅","reading":"ふく","one_reading":"いっぷく","label_kana":"ふく"}],"correct_choice_id":"C","answer_counter_id":"張","answer":"張","answer_reading":"はり","explanation":"太鼓は、ひとはり、ふたはり、と数えます。「だい」なども使われます。","condition":"かわを はった たいこの、むかしからの かぞえかたの ひとつは？","other_valid_counters":["台","個"],"source_check_flag":"explicit_use_verified","source_checked":true,"evidence":[{"source_id":"daijirin","scope":"題材または用例を直接確認","locator":"太鼓"}],"unique_answer_review":{"status":"reviewed","basis":"問題文の対象・状態を限定し、併用可能な助数詞を選択肢から除外。4択内の唯一解として確認。日本語全体で他の言い方がないという意味ではない。"},"difficulty_review":"題材の身近さと数え方の専門性でコースを選定","editor_note":"","explanation_ruby":[]}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('quiz-data').textContent);
const app=document.getElementById('app');
const courseNames={lower:'小学校（しょうがっこう）低学年（ていがくねん）コース',upper:'小学校高学年（こうがくねん）コース',adult:'大人コース',mania:'マニアックコース'};
const state={course:null,queue:[],index:0,answers:[],locked:false,retry:false,initial:null};
const upperLearnedCounters=new Set(['本','台','羽','頭','足','通','両','校','室','部','着','曲','首','問','字','点','組','話','社']);
function choiceHTML(c,courseId){
  if(courseId==='lower')return `${esc(c.label_kana)}<small><ruby>${esc(c.kanji)}<rt>${esc(c.reading)}</rt></ruby></small>`;
  if(courseId==='upper'){
    if(upperLearnedCounters.has(c.kanji))return `${esc(c.kanji)}<small>${esc(c.reading)}</small>`;
    return `<ruby>${esc(c.kanji)}<rt>${esc(c.reading)}</rt></ruby><small>${esc(c.reading)}</small>`;
  }
  return `${esc(c.kanji)}<small>${esc(c.reading)}</small>`;
}
function uiByCourse(courseId,low,upper,adult){return courseId==='lower'?low:(courseId==='upper'?upper:adult);}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ruby(s){return esc(s).replace(/([一-龯々]+)（([ぁ-ゖー]+)）/g,'<ruby>$1<rt>$2</rt></ruby>');}
function shuffle(items,rng=Math.random){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function makeQueue(courseId){return shuffle(DATA.questions.filter(q=>q.course_id===courseId)).slice(0,50);}
function titleFocus(){const el=app.querySelector('.screen-title');if(el)el.focus();}
function resetState(){state.course=null;state.queue=[];state.index=0;state.answers=[];state.locked=false;state.retry=false;state.initial=null;}
function home(){resetState();app.innerHTML=`<header class="hero"><div class="eyebrow">Kussoon · まなぶ・あそぶ</div><div class="numbers" aria-hidden="true"><span>1</span><span>2</span><span>3</span></div><h1 class="screen-title" tabindex="-1">${ruby('数（かぞ）え方（かた）クイズ')}</h1><p>えんぴつは「ほん」。たんすは……？</p></header><div class="inside"><p class="center">みぢかな ものから、びっくりする かぞえかたまで。<br>すきな コースを えらんで、50もんに ちょうせんしよう！</p><div class="stack">${DATA.courses.map(c=>`<button class="course" data-start="${c.id}"><strong>${ruby(courseNames[c.id])}</strong><small>${esc(c.description)}</small></button>`).join('')}</div><nav class="stack"><button class="secondary" data-view="list">${ruby('数（かぞ）え方（かた）一覧（いちらん）')}</button><button class="secondary" data-view="guide">${ruby('遊（あそ）び方（かた）')}</button><a class="button secondary" href="https://kussoon.com/games/">${ruby('学（まな）ぶ・遊（あそ）ぶへ もどる')}</a></nav></div>`;titleFocus();}
function start(courseId,queue=null){state.course=courseId;state.retry=!!queue;state.queue=queue?shuffle(queue):makeQueue(courseId);state.index=0;state.answers=[];state.locked=false;if(!queue)state.initial=null;renderQuestion();}
function renderQuestion(){state.locked=false;const q=state.queue[state.index];const choices=shuffle(q.choices);const retryLabel=uiByCourse(state.course,'もういちど · ','もう一度 · ','もう一度 · ');const correctLabel=uiByCourse(state.course,'せいかい ','正解（せいかい） ','正解 ');const stopLabel=uiByCourse(state.course,'ここで やめる','ここでやめる','ここでやめる');app.innerHTML=`<div class="quiz-count-fixed" aria-live="polite" aria-label="問題の進み具合">${state.index+1}/${state.queue.length}</div><section class="inside"><div class="bar" style="justify-content:flex-start;padding-right:92px"><span>${ruby(correctLabel)}${state.answers.filter(a=>a.correct).length}</span></div><div class="progress" role="progressbar" aria-label="こたえた もんだい" aria-valuemin="0" aria-valuemax="${state.queue.length}" aria-valuenow="${state.index}"><span style="width:${state.index/state.queue.length*100}%"></span></div><p class="eyebrow center">${state.retry?ruby(retryLabel):''}${ruby(courseNames[state.course])}</p><h2 class="question screen-title" tabindex="-1">${ruby(q.question)}</h2><div class="grid choices">${choices.map(c=>`<button data-answer="${c.id}">${choiceHTML(c,state.course)}</button>`).join('')}</div><div id="feedback" aria-live="polite" aria-atomic="true"></div><button class="stop-button" data-stop>${ruby(stopLabel)}</button></section>`;titleFocus();}
function recordAnswer(id){if(state.locked)return null;const q=state.queue[state.index];if(!q.choices.some(c=>c.id===id))return null;state.locked=true;const correct=id===q.correct_choice_id;const entry={question:q,selected:id,correct};state.answers.push(entry);return entry;}
function answer(id){const entry=recordAnswer(id);if(!entry)return;const q=entry.question;for(const btn of app.querySelectorAll('[data-answer]')){btn.disabled=true;if(btn.dataset.answer===q.correct_choice_id)btn.classList.add('correct');else if(btn.dataset.answer===id)btn.classList.add('incorrect');}const nextLabel=state.index+1===state.queue.length?uiByCourse(state.course,'けっかを みる','結果（けっか）を見る','結果を見る'):uiByCourse(state.course,'つぎの もんだいへ','次の問題へ','次の問題へ');const mark=entry.correct?uiByCourse(state.course,'○ せいかい！','○ 正解（せいかい）！','○ 正解！'):uiByCourse(state.course,'△ おしい！','△ 惜（お）しい！','△ 惜しい！');const answerLead=uiByCourse(state.course,'こたえは','答（こた）えは','答えは');app.querySelector('#feedback').innerHTML=`<div class="feedback"><h3 class="${entry.correct?'right':'wrong'}">${ruby(mark)}</h3><p>${ruby(answerLead)}「${esc(q.answer_reading)}」<ruby>${esc(q.answer)}<rt>${esc(q.answer_reading)}</rt></ruby>です。</p><p>${ruby(q.explanation)}</p></div><button data-next>${ruby(nextLabel)}</button>`;app.querySelector('[data-next]').focus();}
function wrongQuestions(){return state.answers.filter(a=>!a.correct).map(a=>a.question);}
function next(){if(!state.locked)return;if(state.index+1<state.queue.length){state.index++;renderQuestion();}else result();}
function result(){const score=state.answers.filter(a=>a.correct).length;const wrong=wrongQuestions();if(!state.retry)state.initial={score,total:state.queue.length};const title=state.retry?uiByCourse(state.course,'もういちどの けっか','もう一度の結果（けっか）','もう一度の結果'):uiByCourse(state.course,'けっか','結果（けっか）','結果');const perfect=uiByCourse(state.course,'ぜんぶ せいかい！ おみごと！','全部正解（せいかい）！ お見事！','全部正解！ お見事！');const good=uiByCourse(state.course,'よく がんばったね！','よくがんばったね！','よくできました！');const learn=uiByCourse(state.course,'あたらしい かぞえかたを おぼえたね！','新しい数え方を覚（おぼ）えたね！','新しい数え方を覚えました！');const retryText=uiByCourse(state.course,`まちがえた ${wrong.length}もんに もういちど`,`間違（まちが）えた ${wrong.length}問にもう一度`,`間違えた ${wrong.length}問にもう一度`);const sameText=uiByCourse(state.course,'おなじ コースで もういちど','同じコースでもう一度','同じコースでもう一度');const chooseText=uiByCourse(state.course,'コースを えらぶ','コースを選（えら）ぶ','コースを選ぶ');const reviewTitle=uiByCourse(state.course,'今回（こんかい）の おさらい','今回のおさらい','今回のおさらい');const answerLead=uiByCourse(state.course,'こたえ：','答（こた）え：','答え：');app.innerHTML=`<section class="inside"><h2 class="center screen-title" tabindex="-1">${ruby(title)}</h2><p class="center">${ruby(courseNames[state.course])}</p><div class="score center">${score}<small> / ${state.queue.length}</small></div><p class="center">${ruby(score===state.queue.length?perfect:score>=state.queue.length/2?good:learn)}</p>${state.retry?`<p class="muted center">${ruby(uiByCourse(state.course,'はじめの50もん：','最初の50問：','最初の50問：'))}${state.initial.score} / ${state.initial.total}<br>${ruby(uiByCourse(state.course,'いまの けっかは、まちがえた もんだいの ふくしゅうです。','今の結果（けっか）は、間違（まちが）えた問題の復習（ふくしゅう）です。','今の結果は、間違えた問題の復習です。'))}</p>`:''}<div class="stack">${wrong.length?`<button data-retry>${ruby(retryText)}</button>`:''}<button class="${wrong.length?'secondary':''}" data-start="${state.course}">${ruby(sameText)}</button><button class="secondary" data-view="home">${ruby(chooseText)}</button></div><h3 style="margin-top:26px">${ruby(reviewTitle)}</h3>${state.answers.map(a=>`<div class="review-item"><p><strong>${a.correct?'○':'△'} ${ruby(a.question.question)}</strong></p><p>${ruby(answerLead)}<ruby>${esc(a.question.answer)}<rt>${esc(a.question.answer_reading)}</rt></ruby>（${esc(a.question.answer_reading)}）</p><p>${ruby(a.question.explanation)}</p></div>`).join('')}</section>`;titleFocus();}
function guide(){app.innerHTML=`<section class="inside"><h2 class="screen-title" tabindex="-1">${ruby('遊（あそ）び方（かた）')}</h2><p>${ruby('① 好（す）きなコースを選（えら）びます。どのコースからでも遊（あそ）べます。')}</p><p>${ruby('② 1コースは50問（もん）です。4つの答（こた）えから、ひとつを選（えら）びましょう。画面（がめん）の右上（みぎうえ）に、今（いま）何問目（なんもんめ）かを表示（ひょうじ）します。')}</p><p>${ruby('③ 答（こた）えると、正解（せいかい）と短（みじか）い説明（せつめい）が出（で）ます。読（よ）んでから「次（つぎ）の問題（もんだい）へ」を押（お）しましょう。')}</p><p>${ruby('④ 途中（とちゅう）で終（お）わりたいときは「ここでやめる」を押（お）します。そこまでの回答（かいとう）はリセットされ、コース選択（せんたく）に戻（もど）ります。')}</p><p>${ruby('⑤ 50問（もん）終（お）わったら、結果（けっか）を見（み）ます。間違（まちが）えた問題（もんだい）だけ、もう一度（いちど）遊（あそ）べます。')}</p><div class="feedback"><p>${ruby('同（おな）じ物（もの）でも、形（かたち）や使（つか）い方（かた）によって、数（かぞ）え方（かた）が変（か）わることがあります。問題（もんだい）の条件（じょうけん）をよく読（よ）んでね。')}</p><p>${ruby('昔（むかし）の数（かぞ）え方（かた）は、今（いま）も必（かなら）ず使（つか）うという意味（いみ）ではありません。')}</p></div><p class="muted">${ruby('プレイの記録（きろく）は保存（ほぞん）しません。「ここでやめる」を押（お）すか、ページを再読（さいよ）み込（こ）みすると、途中（とちゅう）までの結果（けっか）はリセットされます。')}</p><button class="secondary" data-view="home">${ruby('コースを選（えら）ぶ')}</button></section>`;titleFocus();}
function list(){app.innerHTML=`<section class="inside" id="list-top"><h2 class="screen-title" tabindex="-1">${ruby('数（かぞ）え方（かた）一覧（いちらん）')}</h2><p>こたえと せつめいを、ゆっくり みてみよう。</p><div class="fields"><label>コース<select id="list-course"><option value="all">ぜんぶの コース</option>${DATA.courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>さがす<input id="list-search" type="search" placeholder="例：えんぴつ、ほん" autocomplete="off"></label></div><p id="list-count" class="muted" aria-live="polite"></p><div id="list-items"></div><button class="secondary to-top-bottom" data-top aria-label="先頭に戻る"><span aria-hidden="true">↑</span>先頭に戻る</button><button class="secondary" style="margin-top:10px" data-view="home">コースを えらぶ</button></section><button class="to-top-fixed" data-top aria-label="先頭に戻る" title="先頭に戻る">↑</button>`;filterList();titleFocus();}
function termWithReading(term,reading){return term===reading?esc(term):`${esc(term)}（${esc(reading)}）`;}
function filterList(){const course=app.querySelector('#list-course').value;const term=app.querySelector('#list-search').value.trim().normalize('NFKC');const items=DATA.questions.filter(q=>(course==='all'||q.course_id===course)&&(!term||[q.subject,q.subject_reading,q.answer,q.answer_reading,q.question,q.explanation].join(' ').normalize('NFKC').includes(term)));app.querySelector('#list-count').textContent=`${items.length}もん`;app.querySelector('#list-items').innerHTML=items.length?items.map(q=>`<details><summary>${termWithReading(q.subject,q.subject_reading)} → ${termWithReading(q.answer,q.answer_reading)}</summary><p>${ruby(q.question)}</p><p>こたえ：<strong>${termWithReading(q.answer,q.answer_reading)}</strong></p><p>${ruby(q.explanation)}</p><details class="source"><summary><ruby>出典<rt>しゅってん</rt></ruby></summary>${q.evidence.map(e=>{const s=DATA.sources[e.source_id];return `<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><br><span class="muted">${esc(e.scope)}：${esc(e.locator)}</span></p>`;}).join('')}</details></details>`).join(''):'<p>みつかりませんでした。ほかの ことばで さがしてね。</p>';}
app.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-top')){window.scrollTo({top:0,behavior:'smooth'});return;}if(b.hasAttribute('data-stop')){home();return;}if(b.dataset.start)start(b.dataset.start);else if(b.dataset.answer)answer(b.dataset.answer);else if(b.hasAttribute('data-next'))next();else if(b.hasAttribute('data-retry'))start(state.course,wrongQuestions());else if(b.dataset.view)({home,list,guide}[b.dataset.view])();});
app.addEventListener('input',event=>{if(event.target.id==='list-search')filterList();});
app.addEventListener('change',event=>{if(event.target.id==='list-course')filterList();});
home();
</script>
</body></html>

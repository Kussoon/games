<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>コミュニティ色分け確認地図｜西宮市町名記憶ゲーム</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--navy:#16365c;--blue:#2f75b5;--ink:#203040}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(#eef7ff,#fff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}
    body{padding:env(safe-area-inset-top) 10px calc(18px + env(safe-area-inset-bottom))}
    .page{width:min(820px,100%);margin:auto}
    .back{display:inline-flex;align-items:center;min-height:42px;padding:8px 14px;border-radius:999px;background:#fff;color:var(--navy);font-weight:800;text-decoration:none;box-shadow:0 2px 8px #16365c22}
    h1{margin:9px 0 2px;text-align:center;color:var(--navy);font-size:clamp(23px,5.8vw,34px)}
    .stage{text-align:center;color:var(--blue);font-weight:900;font-size:17px}
    .teacher{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin:9px 0}
    .teacher img{width:70px;height:70px;object-fit:cover;object-position:top;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 2px 10px #16365c33}
    .speech{position:relative;background:#fff;border:2px solid #9bc9ef;border-radius:16px;padding:10px 13px;font-weight:700;line-height:1.5;box-shadow:0 2px 8px #16365c18}
    .speech:before{content:"";position:absolute;left:-11px;top:25px;border-width:8px 11px 8px 0;border-style:solid;border-color:transparent #9bc9ef transparent transparent}
    .speech:after{content:"";position:absolute;left:-8px;top:27px;border-width:6px 9px 6px 0;border-style:solid;border-color:transparent white transparent transparent}
    .panel{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}
    .answer{min-height:69px;padding:7px 12px;border-radius:14px;background:var(--navy);color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px #16365c33}
    .answer small{font-size:11px;opacity:.82}.town{font-size:clamp(18px,5vw,27px);font-weight:900}.community{font-weight:800;color:#ffdc65}
    select{min-width:145px;border:2px solid #9bc9ef;border-radius:12px;background:#fff;color:var(--navy);font-weight:800;padding:7px}
    .map-wrap{position:relative;border:3px solid #fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px #16365c33;background:#dfeaf1}
    #map{height:min(60vh,650px);min-height:430px;background:#dfeaf1}
    .tools{position:absolute;z-index:500;right:8px;top:8px}.tools button{border:0;border-radius:10px;background:#fff;color:var(--navy);font-weight:900;padding:9px 11px;box-shadow:0 2px 8px #16365c33}
    .legend{display:flex;flex-wrap:wrap;gap:5px 9px;margin:10px 2px;font-size:11px}.legend span{display:inline-flex;align-items:center;gap:4px}.swatch{width:13px;height:13px;border:1px solid #fff;box-shadow:0 0 0 1px #567;border-radius:3px}
    .warning{background:#fff4d4;border:1px solid #e5bd43;border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.55}
    .credit{margin-top:12px;padding-top:9px;border-top:1px solid #cad8e3;font-size:10px;line-height:1.5;color:#657786}
    .leaflet-container{font:inherit}.town-tooltip{background:#16365c;color:white;border:0;border-radius:8px;font-weight:800;box-shadow:0 2px 8px #0003}.town-tooltip:before{border-top-color:#16365c}
    @media(max-width:520px){body{padding-left:7px;padding-right:7px}.teacher{grid-template-columns:58px 1fr}.teacher img{width:58px;height:58px}.speech{font-size:13px;padding:8px 10px}.panel{grid-template-columns:1fr}select{width:100%;height:42px}#map{height:54vh;min-height:390px}.legend{font-size:10px}}
  </style>
</head>
<body>
<main class="page">
  <a class="back" href="../nishi-comm.html">← ゲームトップへ</a>
  <h1>コミュニティ色分け地図</h1>
  <div class="stage">第1段階・割り当て確認版</div>

  <section class="teacher">
    <img src="../images/kisaragi-teacher.png" alt="如月先生">
    <div class="speech" id="message">町域をタップすると、町名と割り当てたコミュニティを確認できます。</div>
  </section>

  <div class="panel">
    <div class="answer" aria-live="polite">
      <small>選んだ町域</small>
      <div class="town" id="townName">地図をタップ</div>
      <div class="community" id="communityName">26コミュニティを色分けしています</div>
    </div>
    <select id="communityFilter" aria-label="表示するコミュニティ">
      <option value="">すべて表示</option>
    </select>
  </div>

  <div class="map-wrap">
    <div id="map" aria-label="西宮市のコミュニティ色分け地図"></div>
    <div class="tools"><button type="button" id="resetView">全体表示</button></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="warning"><strong>確認事項：</strong>岡田山は町内の番地によって「広田」と「上ヶ原」に分かれますが、GeoShapeでは町全体が一つの図形です。この確認版では黄色の「境界要確認」としています。海上の港湾区域は対象外です。</div>
  <p class="credit">出典：『国勢調査町丁・字等別境界データセット』（CODH作成）「令和2年国勢調査町丁・字等別境界データ」（e-Stat）を加工。CC BY 4.0／doi:10.20676/00000450</p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(() => {
  const map = L.map('map', {zoomControl:true,attributionControl:false,minZoom:10,maxZoom:18});
  const townName = document.getElementById('townName');
  const communityName = document.getElementById('communityName');
  const message = document.getElementById('message');
  const filter = document.getElementById('communityFilter');
  const legend = document.getElementById('legend');
  let townLayer;
  let allBounds;
  let mapping;
  let selectedTown = '';

  function colorFor(name, communities) {
    if (name === '境界要確認') return '#ffd34d';
    if (name === '対象外（水域）') return '#9ba9b5';
    if (name === '未割当') return '#ed6a5a';
    const index = communities.indexOf(name);
    return `hsl(${(index * 137.508) % 360} 63% 57%)`;
  }

  function infoFor(feature) {
    const name = feature.properties.S_NAME;
    return {name, ...(mapping.towns[name] || {community:'未割当',status:'確認が必要'})};
  }

  function styleFor(feature) {
    const info = infoFor(feature);
    const chosen = filter.value;
    const active = !chosen || chosen === info.community;
    const selected = selectedTown === info.name;
    return {
      color: selected ? '#14283e' : '#fff',
      weight: selected ? 2.8 : 1,
      fillColor: colorFor(info.community, mapping.communities),
      fillOpacity: active ? .83 : .09
    };
  }

  Promise.all([
    fetch('nishinomiya-towns.topojson').then(r => {if(!r.ok) throw Error('境界データ'); return r.json()}),
    fetch('community-town-map.json').then(r => {if(!r.ok) throw Error('割り当てデータ'); return r.json()})
  ]).then(([topology, mapData]) => {
    mapping = mapData;
    mapping.communities.forEach(name => filter.add(new Option(name, name)));
    ['境界要確認','対象外（水域）'].forEach(name => filter.add(new Option(name, name)));

    [...mapping.communities,'境界要確認','対象外（水域）'].forEach(name => {
      const item = document.createElement('span');
      item.innerHTML = `<i class="swatch" style="background:${colorFor(name,mapping.communities)}"></i>${name}`;
      legend.appendChild(item);
    });

    const geojson = topojson.feature(topology, topology.objects.town);
    townLayer = L.geoJSON(geojson, {
      style: styleFor,
      onEachFeature(feature, layer) {
        const info = infoFor(feature);
        layer.bindTooltip(`${info.name}｜${info.community}`, {sticky:true,direction:'top',className:'town-tooltip'});
        layer.on('click', () => {
          selectedTown = info.name;
          townName.textContent = info.name;
          communityName.textContent = info.community;
          message.textContent = `${info.name}は「${info.community}」に割り当てています。${info.status === '自動照合' ? '' : '（' + info.status + '）'}`;
          townLayer.setStyle(styleFor);
        });
      }
    }).addTo(map);
    allBounds = townLayer.getBounds();
    map.fitBounds(allBounds,{padding:[8,8]});
  }).catch(error => {
    townName.textContent = '地図を読み込めませんでした';
    communityName.textContent = '必要な3ファイルを確認してください';
    message.textContent = '境界データまたは割り当てデータが見つかりません。';
    console.error(error);
  });

  filter.addEventListener('change', () => {
    selectedTown = '';
    if (townLayer) townLayer.setStyle(styleFor);
  });
  document.getElementById('resetView').addEventListener('click', () => {
    filter.value = '';
    selectedTown = '';
    if (townLayer) townLayer.setStyle(styleFor);
    if (allBounds) map.fitBounds(allBounds,{padding:[8,8]});
  });
})();
</script>
</body>
</html>
